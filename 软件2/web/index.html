<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>软件2 - 低压组态监测</title>
    <link rel="stylesheet" href="./styles.css?v=20260524-alarm-events-4" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <strong>站级前端</strong>
            <span>演示变电站</span>
          </div>
        </div>
        <nav id="navList" class="nav-list"></nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">软件2 · 单站低压侧</p>
            <h1 id="pageTitle">低压组态监测</h1>
          </div>
          <div class="topbar-status">
            <span id="collectorStatus" class="status-pill collector-status online">数据采集软件在线</span>
            <span class="status-pill"><span id="refreshTime">0000-00-00 --:--:--</span></span>
          </div>
        </header>

        <section id="overviewPage" class="page page-active">
          <div class="summary-strip" aria-label="运行摘要">
            <article>
              <span>低压柜</span>
              <strong>AA0-AA11</strong>
            </article>
            <article>
              <span>内部回路</span>
              <strong id="circuitCount">--</strong>
            </article>
            <article>
              <span>真实采集</span>
              <strong id="boundCount">--</strong>
            </article>
            <article>
              <span>未接入</span>
              <strong id="unboundCount">--</strong>
            </article>
          </div>

          <div class="topology-panel">
            <div class="panel-toolbar">
              <div>
                <strong>低压侧一次组态图</strong>
                <span>双击任一回路查看实时信息</span>
              </div>
              <div class="toolbar-actions">
                <div class="zoom-controls" aria-label="组态图缩放">
                  <button id="zoomOutButton" class="tool-button" type="button" title="缩小">−</button>
                  <span id="zoomValue" class="zoom-value">100%</span>
                  <button id="zoomInButton" class="tool-button" type="button" title="放大">+</button>
                  <button id="zoomFitButton" class="tool-button fit-button" type="button" title="适应宽度">适屏</button>
                </div>
              </div>
            </div>

            <div id="topologyStage" class="topology-stage">
              <div id="topologyCanvas" class="topology-canvas">
                <div id="topologySvgHost" class="topology-svg-host" aria-label="低压侧组态图"></div>
                <div id="currentLayer" class="current-layer" aria-label="三相电流实时数据层"></div>
                <div id="hotspotLayer" class="hotspot-layer" aria-label="回路交互层"></div>
              </div>
            </div>
          </div>
        </section>

        <section id="historyPage" class="page">
          <div class="history-page-layout">
            <section class="history-query-panel" aria-label="历史数据查询条件">
              <label class="history-filter-field history-circuit-field">
                <span>回路编号 / 回路名称</span>
                <div class="history-circuit-combobox">
                  <input
                    id="historyCircuitInput"
                    type="text"
                    placeholder="输入或选择回路"
                    autocomplete="off"
                    role="combobox"
                    aria-expanded="false"
                    aria-controls="historyCircuitDropdown"
                  />
                  <button id="historyCircuitToggle" class="history-circuit-toggle" type="button" title="选择回路" aria-label="选择回路">▼</button>
                  <div id="historyCircuitDropdown" class="history-circuit-dropdown" role="listbox" hidden></div>
                </div>
              </label>

              <div class="history-page-time-fields">
                <div id="historyPageStartField"></div>
                <div id="historyPageEndField"></div>
              </div>

              <label class="history-filter-field">
                <span>每页条数</span>
                <select id="historyPageSizeSelect">
                  <option value="10">10 条</option>
                  <option value="20" selected>20 条</option>
                  <option value="50">50 条</option>
                  <option value="100">100 条</option>
                </select>
              </label>

              <label class="history-filter-field">
                <span>时间顺序</span>
                <select id="historyOrderSelect">
                  <option value="desc" selected>时间倒序</option>
                  <option value="asc">时间顺序</option>
                </select>
              </label>

              <button id="historyPageQueryButton" class="history-query-button" type="button">查询</button>
            </section>

            <section class="history-results-panel" aria-label="历史数据查询结果">
              <div class="history-result-toolbar">
                <div>
                  <strong id="historyResultTitle">请选择回路并查询</strong>
                  <span id="historyResultMeta">结束时间默认填写当前时间</span>
                </div>
                <div class="history-pagination">
                  <button id="historyPrevPageButton" class="tool-button" type="button" title="上一页">‹</button>
                  <span id="historyPageInfo">第 1 页</span>
                  <button id="historyNextPageButton" class="tool-button" type="button" title="下一页">›</button>
                </div>
              </div>
              <div id="historyPageStatus" class="history-page-status"></div>
              <div id="historyTableHost" class="history-table-host"></div>
            </section>
          </div>
        </section>

        <section id="alarmEventPage" class="page">
          <div class="alarm-event-layout">
            <div class="alarm-event-tabs" role="tablist" aria-label="告警事件视图">
              <button id="alarmTabButton" class="alarm-event-tab active" type="button" role="tab" aria-selected="true" data-alarm-event-tab="alarms">告警</button>
              <button id="eventTabButton" class="alarm-event-tab" type="button" role="tab" aria-selected="false" data-alarm-event-tab="events">事件</button>
            </div>

            <section id="alarmPanel" class="alarm-event-panel active" aria-label="告警查询与管理">
              <div class="alarm-query-panel">
                <label class="alarm-filter-field">
                  <span>状态</span>
                  <select id="alarmStatusFilter">
                    <option value="">全部</option>
                    <option value="active">活动</option>
                    <option value="acknowledged">已确认</option>
                    <option value="recovered">已恢复</option>
                    <option value="closed">已关闭</option>
                  </select>
                </label>
                <label class="alarm-filter-field">
                  <span>等级</span>
                  <select id="alarmLevelFilter">
                    <option value="">全部</option>
                    <option value="critical">严重</option>
                    <option value="warning">告警</option>
                    <option value="info">提示</option>
                  </select>
                </label>
                <label class="alarm-filter-field">
                  <span>关键字</span>
                  <input id="alarmKeywordFilter" type="text" placeholder="标题、仪表" />
                </label>
                <div id="alarmStartField"></div>
                <div id="alarmEndField"></div>
                <label class="alarm-filter-field compact">
                  <span>每页</span>
                  <select id="alarmPageSizeSelect">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                  </select>
                </label>
                <button id="alarmQueryButton" class="history-query-button" type="button">查询</button>
              </div>
              <div class="alarm-summary-strip" aria-label="告警摘要">
                <article><span>活动</span><strong id="activeAlarmCount">--</strong></article>
                <article><span>已确认</span><strong id="ackAlarmCount">--</strong></article>
                <article><span>已恢复</span><strong id="recoveredAlarmCount">--</strong></article>
                <article><span>已关闭</span><strong id="closedAlarmCount">--</strong></article>
              </div>
              <div class="alarm-results-panel">
                <div class="history-result-toolbar">
                  <div>
                    <strong id="alarmResultTitle">告警列表</strong>
                    <span id="alarmResultMeta">按开始时间倒序</span>
                  </div>
                  <div class="history-pagination">
                    <button id="alarmPrevPageButton" class="tool-button" type="button" title="上一页">‹</button>
                    <span id="alarmPageInfo">第 1 页</span>
                    <button id="alarmNextPageButton" class="tool-button" type="button" title="下一页">›</button>
                  </div>
                </div>
                <div id="alarmPageStatus" class="history-page-status"></div>
                <div id="alarmTableHost" class="history-table-host"></div>
              </div>
            </section>

            <section id="eventPanel" class="alarm-event-panel" aria-label="事件查询">
              <div class="alarm-query-panel">
                <label class="alarm-filter-field">
                  <span>类型</span>
                  <input id="eventTypeFilter" type="text" placeholder="alarm_ack / comm_status" />
                </label>
                <label class="alarm-filter-field">
                  <span>等级</span>
                  <select id="eventLevelFilter">
                    <option value="">全部</option>
                    <option value="critical">严重</option>
                    <option value="warning">告警</option>
                    <option value="info">提示</option>
                  </select>
                </label>
                <label class="alarm-filter-field">
                  <span>关键字</span>
                  <input id="eventKeywordFilter" type="text" placeholder="标题、描述、仪表" />
                </label>
                <div id="eventStartField"></div>
                <div id="eventEndField"></div>
                <label class="alarm-filter-field compact">
                  <span>每页</span>
                  <select id="eventPageSizeSelect">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                  </select>
                </label>
                <button id="eventQueryButton" class="history-query-button" type="button">查询</button>
              </div>
              <div class="alarm-results-panel">
                <div class="history-result-toolbar">
                  <div>
                    <strong>事件列表</strong>
                    <span id="eventResultMeta">按事件时间倒序</span>
                  </div>
                  <div class="history-pagination">
                    <button id="eventPrevPageButton" class="tool-button" type="button" title="上一页">‹</button>
                    <span id="eventPageInfo">第 1 页</span>
                    <button id="eventNextPageButton" class="tool-button" type="button" title="下一页">›</button>
                  </div>
                </div>
                <div id="eventPageStatus" class="history-page-status"></div>
                <div id="eventTableHost" class="history-table-host"></div>
              </div>
            </section>
          </div>
        </section>

        <section id="substation3dPage" class="page">
          <div class="substation-3d-layout">
            <section class="substation-3d-panel" aria-label="AA1三维配电柜">
              <div class="panel-toolbar substation-3d-toolbar">
                <div>
                  <strong>AA1负荷开关柜三维可视化</strong>
                  <span>指示灯和开关把手随回路通断状态刷新</span>
                </div>
                <div class="toolbar-actions">
                  <button class="tool-button fit-button" type="button" title="正视图" data-substation-view="front">正视</button>
                  <button class="tool-button fit-button" type="button" title="侧视图" data-substation-view="side">侧视</button>
                  <button class="tool-button fit-button" type="button" title="俯视图" data-substation-view="top">俯视</button>
                  <button class="tool-button fit-button" type="button" title="45度视角" data-substation-view="iso">45°</button>
                  <button id="substation3dFitButton" class="tool-button fit-button" type="button" title="适配模型">适配</button>
                  <button id="substation3dResetButton" class="tool-button fit-button" type="button" title="复位视角">复位</button>
                </div>
              </div>
              <div id="substation3dViewport" class="substation-3d-viewport">
                <div id="substation3dStatus" class="substation-3d-status">正在初始化三维视图...</div>
              </div>
            </section>
            <aside class="substation-3d-side" aria-label="AA1回路状态">
              <div class="substation-3d-legend">
                <span><i class="state-dot closed"></i>通路</span>
                <span><i class="state-dot open"></i>断路</span>
                <span><i class="state-dot unknown"></i>未知</span>
              </div>
              <div id="substation3dCircuitList" class="substation-3d-circuit-list"></div>
            </aside>
          </div>
        </section>

        <section id="placeholderPage" class="page">
          <div class="placeholder-card">
            <h2 id="placeholderTitle"></h2>
            <p id="placeholderBody"></p>
          </div>
        </section>
      </main>
    </div>

    <dialog id="circuitDialog" class="circuit-dialog">
      <form method="dialog">
        <button class="icon-button close-button" value="close" aria-label="关闭">×</button>
      </form>
      <div id="dialogContent"></div>
    </dialog>

    <dialog id="alarmActionDialog" class="alarm-action-dialog">
      <form method="dialog">
        <button class="icon-button close-button" value="cancel" aria-label="关闭">×</button>
      </form>
      <form id="alarmActionForm" class="alarm-action-form">
        <h2 id="alarmActionTitle">处理告警</h2>
        <p id="alarmActionMeta"></p>
        <label>
          <span>处理人</span>
          <input id="alarmActionOperator" type="text" value="值班员" />
        </label>
        <label>
          <span>处理说明</span>
          <textarea id="alarmActionNote" rows="4" placeholder="填写确认原因、处理过程或关闭说明"></textarea>
        </label>
        <div id="alarmActionStatus" class="history-page-status"></div>
        <div class="alarm-action-buttons">
          <button class="tool-button" type="button" value="cancel" data-close-alarm-action>取消</button>
          <button id="alarmActionSubmit" class="history-query-button" type="submit">提交</button>
        </div>
      </form>
    </dialog>

    <div id="alarmToastHost" class="alarm-toast-host" aria-live="polite" aria-label="实时告警提示"></div>

    <script src="./topology-config.js?v=20260525-substation-3d-3"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/three/three.module.js"
        }
      }
    </script>
    <script src="./app.js?v=20260525-substation-3d-8"></script>
  </body>
</html>
